name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas y compilación
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app-memoria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-memoria
          path: app-memoria.apk

      - name: Publicar versión para descargar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Versión 0.1.${{ github.run_number }}
          make_latest: true
          files: app-memoria.apk
